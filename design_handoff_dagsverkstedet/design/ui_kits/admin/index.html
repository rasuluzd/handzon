<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><title>Handz On Auto Care — adminpanel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="admin.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../ds-boot.js"></script>
<script src="../data.js"></script>
<script src="sales-data.js"></script>
<style>body{background:var(--surface-alt);margin:0}</style>
</head><body>
<div id="app"></div>
<script>
window.HZ.boot('../../').then(function(NS){
  window.HZ_COMPONENTS = NS;
  ['chrome.jsx.txt','screen-oversikt.jsx.txt','screen-bestillinger.jsx.txt','screen-rapport.jsx.txt','screen-tjenester.jsx.txt','screen-blogg.jsx.txt','app.jsx.txt']
    .reduce(function(p,f){
      return p.then(function(){
        return fetch(f).then(function(r){return r.text()}).then(function(code){
          (0,eval)(Babel.transform(code,{presets:['react']}).code);
        });
      });
    }, Promise.resolve())
    .catch(function(e){ console.error('Adminpanelet lastet ikke:', e); });
});
</script>
</body></html>
